[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-fall"
version = "0.1.0"
description = "3D MuJoCo workload for CPU versus CUDA PPO benchmarking"
requires-python = ">=3.12"
dependencies = [
  "gymnasium==1.3.0",
  "mujoco==3.13.0",
  "numpy==2.5.3",
  "psutil==7.2.2",
  "stable-baselines3==2.9.0",
  "torch==2.14.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
